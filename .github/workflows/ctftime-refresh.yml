name: Refresh CTFtime and Medium snapshots

on:
  schedule:
    - cron: "30 3 * * 1" # every Monday 03:30 UTC (09:00 IST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ctftime-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The script only uses built-in fetch, so no npm install is needed.
      - run: node scripts/fetch-ctftime.mjs
      - run: node scripts/fetch-medium.mjs
      - name: Commit if the snapshot changed
        run: |
          if git diff --quiet -- data/ctftime.json data/medium.json public/ctftime; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ctftime.json data/medium.json public/ctftime
          git commit -m "Refresh CTFtime and Medium snapshots"
          git push
