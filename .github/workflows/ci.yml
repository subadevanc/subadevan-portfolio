name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Lighthouse (performance, accessibility, SEO, best practices)
        run: |
          npx next start -p 3000 &
          npx wait-on http://localhost:3000 --timeout 60000
          npx @lhci/cli@0.14.x autorun \
            --collect.url=http://localhost:3000/ \
            --collect.numberOfRuns=1 \
            --assert.preset=lighthouse:no-pwa \
            --assert.assertions.categories:performance=warn \
            --assert.assertions.categories:accessibility=["error",{"minScore":0.9}] \
            --upload.target=filesystem --upload.outputDir=lhci-report || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lhci-report
          if-no-files-found: ignore
